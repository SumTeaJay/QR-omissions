[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-omissions"
version = "0.1.0"
description = "Signed QR event passes and organizer point tracking"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "qrcode[pil]>=8,<9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]


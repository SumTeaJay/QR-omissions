services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qr_omissions
      POSTGRES_USER: qr_user
      POSTGRES_PASSWORD: qr_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr_user -d qr_omissions"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:

